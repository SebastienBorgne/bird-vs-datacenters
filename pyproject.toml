[project]
name = "birdy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=5.2,<6.1",
    "django-celery-beat>=2.7.0",
    "django-celery-results>=2.5.1",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "typer>=0.27.2",
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "requests>=2.34.2",
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
]

[project.scripts]
birdy = "core.frameworks.typer_app.typer_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = ["migrations"]

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "core.frameworks.django_app.config.settings"
ignore = ["migrations"]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "redefined-builtin",
    "wrong-import-position",
]

[dependency-groups]
dev = ["ruff>=0.8", "pylint>=3.3", "pylint-django>=2.6", "mypy>=1.13"]
