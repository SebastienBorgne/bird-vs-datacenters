name: ordy

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ordy:latest
  environment: &app-env
    DJANGO_SETTINGS_MODULE: core.frameworks.django_app.config.settings
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-.localhost,localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-ordy}
    POSTGRES_USER: ${POSTGRES_USER:-ordy}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordy}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: django-db
    APP_RUN__DJANGO_USER_NAME: ${APP_RUN__DJANGO_USER_NAME:-admin}
    APP_RUN__DJANGO_USER_PASSWORD: ${APP_RUN__DJANGO_USER_PASSWORD:-admin}
  restart: unless-stopped

services:
  db:
    # PostGIS: spatial queries between bird observations and datacenters.
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordy}
      POSTGRES_USER: ${POSTGRES_USER:-ordy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      # AMQP stays published for celery run on the host (dev); the management
      # UI is served by nginx (rabbitmq.localhost).
      - "${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations, collects static files (served by nginx) and
  # bootstraps the superuser, then exits. Every other app service waits on it
  # so they never race a schema that isn't there yet.
  init:
    <<: *app
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        python -m core.frameworks.django_app.entrypoints.ensure_superuser
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  django:
    <<: *app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      init:
        condition: service_completed_successfully

  celery-beat:
    <<: *app
    command: ["celery", "-A", "core.frameworks.celery_app.app", "beat", "-l", "info"]
    depends_on:
      init:
        condition: service_completed_successfully

  celery-worker:
    <<: *app
    command: ["celery", "-A", "core.frameworks.celery_app.app", "worker", "-l", "info"]
    depends_on:
      init:
        condition: service_completed_successfully

  dashboard:
    <<: *app
    command:
      - streamlit
      - run
      - src/core/frameworks/streamlit_app/app.py
      - --server.headless=true
      - --server.port=8501
      - --browser.gatherUsageStats=false
    depends_on:
      init:
        condition: service_completed_successfully

  # Single entry point: http://localhost (one subdomain per service, see
  # docker/nginx/default.conf.template). `*.localhost` resolves to the
  # loopback in browsers without any /etc/hosts entry.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      NGINX_DOMAIN: ${NGINX_DOMAIN:-localhost}
      DJANGO_UPSTREAM: django:8000
      DASHBOARD_UPSTREAM: dashboard:8501
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
      - static_files:/var/www/static:ro
    depends_on:
      # `restart`: django/dashboard are resolved once at nginx startup, so
      # nginx is restarted whenever compose recreates them.
      django:
        condition: service_started
        restart: true
      dashboard:
        condition: service_started
        restart: true
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.0
    profiles: ["spark"]
    # Jupyter and the Spark UI are served by nginx (jupyter.localhost,
    # spark.localhost).
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-spark}
      # Downloads the Postgres JDBC driver when the session starts
      PYSPARK_SUBMIT_ARGS: --packages org.postgresql:postgresql:42.7.4 pyspark-shell
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ordy}
      POSTGRES_USER: ${POSTGRES_USER:-ordy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordy}
    volumes:
      - spark_data:/home/jovyan/work
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  spark_data:
  static_files:
