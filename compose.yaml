name: ordy

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ordy:latest
  environment: &app-env
    DJANGO_SETTINGS_MODULE: core.frameworks.django_app.config.settings
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-ordy}
    POSTGRES_USER: ${POSTGRES_USER:-ordy}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordy}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: django-db
    APP_RUN__DJANGO_USER_NAME: ${APP_RUN__DJANGO_USER_NAME:-admin}
    APP_RUN__DJANGO_USER_PASSWORD: ${APP_RUN__DJANGO_USER_PASSWORD:-admin}
  restart: unless-stopped

services:
  db:
    # PostGIS: spatial queries between bird observations and datacenters.
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordy}
      POSTGRES_USER: ${POSTGRES_USER:-ordy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations and bootstraps the superuser, then exits.
  # Every other app service waits on it so they never race a schema that
  # isn't there yet.
  init:
    <<: *app
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python -m core.frameworks.django_app.entrypoints.ensure_superuser
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  django:
    <<: *app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  celery-beat:
    <<: *app
    command: ["celery", "-A", "core.frameworks.celery_app.app", "beat", "-l", "info"]
    depends_on:
      init:
        condition: service_completed_successfully

  celery-worker:
    <<: *app
    command: ["celery", "-A", "core.frameworks.celery_app.app", "worker", "-l", "info"]
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
