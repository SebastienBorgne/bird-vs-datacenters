name: ordy

# Dev override: only db/rabbitmq/cassandra/nginx run in Docker. django,
# celery-beat and celery-worker are turned off — `make runserver-dev` /
# `make scheduler` / `make worker` run those locally instead (against the
# db/rabbitmq this stack still starts, both published on their default host
# ports). nginx proxies to the local django through `host.docker.internal`,
# so it must listen on 0.0.0.0.
#
# The dashboard is behind the `dashboard` profile: `make run-dev` enables it
# (with `spark`) and points nginx at the container; with `make up` it stays
# off and nginx proxies to a local `make dashboard` instead.

services:
  django:
    profiles: ["disabled"]

  celery-beat:
    profiles: ["disabled"]

  celery-worker:
    profiles: ["disabled"]

  dashboard:
    profiles: ["dashboard"]
    # The image installs the project in editable mode: mounting the sources
    # makes code changes show up without a rebuild.
    volumes:
      - ./src:/app/src:ro

  nginx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_UPSTREAM: host.docker.internal:8000
      DASHBOARD_UPSTREAM: ${DASHBOARD_UPSTREAM:-host.docker.internal:8501}
    depends_on: !override
      rabbitmq:
        condition: service_started
      # Only when the `dashboard` profile is on: nginx resolves its upstream
      # at startup, so it has to come after the container.
      dashboard:
        condition: service_started
        required: false
